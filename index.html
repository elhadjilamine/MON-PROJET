<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Premier Pas d'Ingénieur</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            color: #38bdf8;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <h1>Bienvenue sur mon premier site web !</h1>
    <p>Je commence ma formation en autodidacte pour devenir ingénieur en informatique.</p>
    
    <!-- Un bouton interactif -->
    <button id="monBouton">Clique-moi</button>

    <!-- Le code JavaScript -->
    <script>
        // On récupère le bouton grâce à son identifiant
        const bouton = document.getElementById('monBouton');

        // On écoute le clic de l'utilisateur
        bouton.addEventListener('click', function() {
            alert('Bravo ! Votre code JavaScript fonctionne et interagit avec la page !');
        });
    </script>
</body>
</html>
