<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Tableau de Bord Ingénieur</title>
    <!-- On relie notre fichier de design CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Mon Espace Ingénieur</h1>
        <p>Bienvenue dans mon application web modulaire.</p>
        
        <div class="counter-box">
            <span id="compteur">0</span> clics
        </div>
        
        <button id="btnAction">Incrémenter</button>
    </div>
    <!-- On relie notre fichier d'interactivité JavaScript -->
    <script src="script.js"></script>
<form action="#" method="POST">
    <h2>Connexion</h2>
    
    <div>
        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required placeholder="nom@exemple.com">
    </div>

    <div>
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" id="btnAction">Se connecter</button>
